[project]
name = "ifcx-oci"
version = "0.1.0"
description = "Experimental IFC artifact layers using GLB, Parquet and OCI"
requires-python = ">=3.13,<3.14"
dependencies = ["ifcopenshell==0.9.0", "pyarrow>=26.0.0,<27"]

[project.scripts]
ifcx-oci = "ifcx_oci.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ifcx_oci"]
