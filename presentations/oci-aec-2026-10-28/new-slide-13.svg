xt x="712" y="301" font-size="21" fill="#556b68" font-weight="500" text-anchor="middle">Two proposed artifact profiles</text><text x="14" y="430" font-size="20" fill="#24786e" font-weight="750" text-anchor="start">01</text><text x="60" y="430" font-size="23" fill="#183e40" font-weight="650" text-anchor="start">Publish model + change</text><text x="503" y="430" font-size="20" fill="#24786e" font-weight="750" text-anchor="start">02</text><text x="549" y="430" font-size="23" fill="#183e40" font-weight="650" text-anchor="start">Copy exact artifacts</text><text x="992" y="430" font-size="20" fill="#24786e" font-weight="750" text-anchor="start">03</text><text x="1038" y="430" font-size="23" fill="#183e40" font-weight="650" text-anchor="start">Open + query the change</text></g><text x="88" y="773" font-size="28" font-weight="700" letter-spacing="-.5">The receiving tool understands the package through the common profile.</text><path d="M88 826H1512" stroke="#cbd4ca"/><text x="88" y="856" font-size="13" font-weight="600" fill="#556b68">Saleem · AnkerDB</text><text x="800" y="856" text-anchor="middle" font-size="13" fill="#556b68">S6 · S7 · S9 · S18</text><text x="1512" y="856" text-anchor="end" font-size="13" fill="#556b68">28 OCT 2026 / ECOSYSTEM PROPOSAL</text></svg>