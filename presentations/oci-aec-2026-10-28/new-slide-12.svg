<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial,Helvetica,sans-serif" fill="#f7f7ec"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a6cfc0"/></marker></defs><rect width="1600" height="900" fill="#183e40"/><text x="88" y="74" font-size="17" font-weight="700" letter-spacing="2.1">12 — SUPPORT INDEPENDENT EVOLUTION</text><text x="88" y="163" font-size="62" font-weight="700" letter-spacing="-2.7">Agree on the contract. Let tools evolve.</text><text x="88" y="218" font-size="27" fill="#c0d4ce">Proposed AEC profiles connect releases and changes across independent applications.</text><g transform="translate(88 252)"><rect x="14" y="20" width="674" height="325" rx="20" fill="#d5f49e" stroke="none" stroke-width="2"/><rect x="736" y="20" width="674" height="325" rx="20" fill="#224c4d" stroke="#48706c" stroke-width="2"/><text x="45" y="70" font-size="21" fill="#183e40" font-weight="750" text-anchor="start">COMMON CONTRACT</text><text x="766" y="70" font-size="21" fill="#d5f49e" font-weight="750" text-anchor="start">INDEPENDENT TOOLS</text><text x="48" y="133" font-size="26" fill="#a6cfc0" font-weight="700" text-anchor="start">•</text><text x="77" y="133" font-size="25" fill="#183e40" font-weight="600" text-anchor="start">Source + target release digests</text><text x="770" y="133" font-size="26" fill="#d5f49e" font-weight="700" text-anchor="start">•</text><text x="799" y="133" font-size="25" fill="#f7f7ec" font-weight="500" text-anchor="start">Comparison + matching algorithms</text><text x="48" y="189" font-size="26" fill="#a6cfc0" font-weight="700" text-anchor="start">•</text><text x="77" y="189" font-size="25" fill="#183e40" font-weight="600" text-anchor="start">Model + entity references</text><text x="770" y="189" font-size="26" fill="#d5f49e" font-weight="700" text-anchor="start">•</text><text x="799" y="18