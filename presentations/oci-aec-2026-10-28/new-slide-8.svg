<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial,Helvetica,sans-serif" fill="#183e40"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24786e"/></marker></defs><rect width="1600" height="900" fill="#f5f2e9"/><text x="88" y="74" font-size="17" font-weight="700" letter-spacing="2.1">08 — THE ENVELOPE AND THE MODEL</text><text x="88" y="163" font-size="62" font-weight="700" letter-spacing="-2.7">An IFCX release, carried as an OCI artifact.</text><text x="88" y="218" font-size="27" fill="#556b68">One typed manifest references model data, geometry and supporting documents.</text><g transform="translate(88 252)"><rect x="14" y="10" width="792" height="460" rx="20" fill="#183e40" stroke="#183e40" stroke-width="2"/><text x="39" y="38" font-size="16" fill="#d5f49e" font-weight="700" >ILLUSTRATIVE OCI MANIFEST · PROPOSED PROFILE</text><text x="39" y="66.0" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">{</text><text x="39" y="84.25" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">  &quot;schemaVersion&quot;: 2,</text><text x="39" y="102.5" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">  &quot;mediaType&quot;: &quot;application/vnd.oci.image.manifest.v1+json&quot;,</text><text x="39" y="120.75" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">  &quot;artifactType&quot;: &quot;application/vnd.example.ifcx.v1&quot;,</text><text x="39" y="139.0" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">  &quot;config&quot;: {</text><text x="39" y="157.25" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">    &quot;mediaType&quot;: &quot;application/vnd.example.ifcx.config.v1+json&quot;,</text><text x="39" y="175.5" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">    &quot;digest&quot;: &quot;sha256:000…&quot;, &quot;size&quot;: 512</text><text x="39" y="193.75" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">  },</text><text x="39" y="212.0" font-size="18" fill="#d5f49e" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">  &quot;layers&quot;: [</text><text x="39" y="230.25" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">    { &quot;mediaType&quot;: &quot;application/vnd.apache.parquet&quot;,</text><text x="39" y="248.5" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">      &quot;digest&quot;: &quot;sha256:111…&quot;, &quot;size&quot;: 8200 },</text><text x="39" y="266.75" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">    { &quot;mediaType&quot;: &quot;application/ld+json&quot;,</text><text x="39" y="285.0" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">      &quot;digest&quot;: &quot;sha256:222…&quot;, &quot;size&quot;: 1800 },</text><text x="39" y="303.25" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">    { &quot;mediaType&quot;: &quot;model/gltf-binary&quot;,</text><text x="39" y="321.5" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">      &quot;digest&quot;: &quot;sha256:333…&quot;, &quot;size&quot;: 49000 },</text><text x="39" y="339.75" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">    { &quot;mediaType&quot;: &quot;application/pdf&quot;,</text><text x="39" y="358.0" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">      &quot;digest&quot;: &quot;sha256:444…&quot;, &quot;size&quot;: 24000 },</text><text x="39" y="376.25" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">    { &quot;mediaType&quot;: &quot;application/vnd.example.custom&quot;,</text><text x="39" y="394.5" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">      &quot;digest&quot;: &quot;sha256:555…&quot;, &quot;size&quot;: 4096 }</text><text x="39" y="412.75" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">  ]</text><text x="39" y="431.0" font-size="18" fill="#f7f7ec" font-weight="500" font-family="Menlo,Consolas,monospace" xml:space="preserve">}</text><text x="39" y="453" font-size="14" fill="#d8e9df" font-weight="500" >Hashes shortened; sizes and example media types are illustrative.</text><path d="M810 250H842" stroke="#24786e" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="850" y="10" width="560" height="106" rx="18" fill="#d5f49e" stroke="none" stroke-width="2"/><text x="876" y="48" font-size="27" fill="#183e40" font-weight="700" >IFCX / AEC profile</text><text x="876" y="80" font-size="21" fill="#183e40" font-weight="500" >Defines IDs, roles, encoding + composition.</text><text x="876" y="104" font-size="18" fill="#556b68" font-weight="500" >Tools declare which payloads they support.</text><rect x="850" y="134" width="560" height="59" rx="13" fill="#d8e9df" stroke="none" stroke-width="2"/><rect x="866" y="147" width="10" height="33" rx="5" fill="#24786e" stroke="none" stroke-width="2"/><text x="892" y="160" font-size="23" fill="#24786e" font-weight="700" >Parquet</text><text x="892" y="183" font-size="17" fill="#183e40" font-weight="500" >Model tables · profile-defined encoding</text><rect x="850" y="203" width="560" height="59" rx="13" fill="#eee4c8" stroke="none" stroke-width="2"/><rect x="866" y="216" width="10" height="33" rx="5" fill="#8e7137" stroke="none" stroke-width="2"/><text x="892" y="229" font-size="23" fill="#8e7137" font-weight="700" >JSON-LD</text><text x="892" y="252" font-size="17" fill="#183e40" font-weight="500" >Linked semantics · agreed mapping</text><rect x="850" y="272" width="560" height="59" rx="13" fill="#dce5e7" stroke="none" stroke-width="2"/><rect x="866" y="285" width="10" height="33" rx="5" fill="#657b89" stroke="none" stroke-width="2"/><text x="892" y="298" font-size="23" fill="#657b89" font-weight="700" >GLB</text><text x="892" y="321" font-size="17" fill="#183e40" font-weight="500" >Geometry · declared payload role</text><rect x="850" y="341" width="560" height="59" rx="13" fill="#f1ded0" stroke="none" stroke-width="2"/><rect x="866" y="354" width="10" height="33" rx="5" fill="#914931" stroke="none" stroke-width="2"/><text x="892" y="367" font-size="23" fill="#914931" font-weight="700" >PDF</text><text x="892" y="390" font-size="17" fill="#183e40" font-weight="500" >Supporting document · optional attachment</text><rect x="850" y="410" width="560" height="59" rx="13" fill="#eaece2" stroke="none" stroke-width="2"/><rect x="866" y="423" width="10" height="33" rx="5" fill="#24786e" stroke="none" stroke-width="2"/><text x="892" y="436" font-size="23" fill="#24786e" font-weight="700" >Custom</text><text x="892" y="459" font-size="17" fill="#183e40" font-weight="500" >Custom bytes · declared type and capability</text></g><text x="88" y="773" font-size="28" font-weight="700" letter-spacing="-.5">OCI layers carry bytes. The IFCX / AEC profile defines their meaning.</text><path d="M88 826H1512" stroke="#cbd4ca"/><text x="88" y="856" font-size="13" font-weight="600" fill="#556b68">Saleem · AnkerDB</text><text x="800" y="856" text-anchor="middle" font-size="13" fill="#556b68">S6 · S20 · S21 · S22 · S23</text><text x="1512" y="856" text-anchor="end" font-size="13" fill="#556b68">28 OCT 2026 / ECOSYSTEM PROPOSAL</text></svg>