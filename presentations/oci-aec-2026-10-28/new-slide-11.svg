<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial,Helvetica,sans-serif" fill="#183e40"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24786e"/></marker></defs><rect width="1600" height="900" fill="#f5f2e9"/><text x="88" y="74" font-size="17" font-weight="700" letter-spacing="2.1">11 — CHANGE IS DATA</text><text x="88" y="163" font-size="62" font-weight="700" letter-spacing="-2.7">Changes deserve their own artifacts.</text><text x="88" y="218" font-size="27" fill="#556b68">A release records a model state. A change artifact records the difference.</text><g transform="translate(88 252)"><rect x="14" y="55" width="205" height="105" rx="20" fill="#eaece2" stroke="#cbd4ca" stroke-width="2"/><text x="40" y="94" font-size="16" fill="#556b68" font-weight="700" text-anchor="start">MODEL STATE</text><text x="40" y="134" font-size="30" fill="#183e40" font-weight="700" text-anchor="start">Release A</text><rect x="14" y="240" width="205" height="105" rx="20" fill="#eaece2" stroke="#cbd4ca" stroke-width="2"/><text x="40" y="279" font-size="16" fill="#556b68" font-weight="700" text-anchor="start">MODEL STATE</text><text x="40" y="319" font-size="30" fill="#183e40" font-weight="700" text-anchor="start">Release B</text><path d="M220 108H250V171H277" fill="none" stroke="#24786e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M220 292H250V229H277" fill="none" stroke="#24786e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="284" y="105" width="284" height="190" rx="20" fill="#fffdf7" stroke="#cbd4ca" stroke-width="2"/><text x="426" y="160" font-size="30" fill="#183e40" font-weight="700" text-anchor="middle">Semantic</text><text x="426" y="198" font-size="30" fill="#183e40" font-weight="700" text-anchor="middle">comparison</text><text x="426" y="247" font-size="20" fill="#556b68" font-weight="500" text-anchor="middle">ifc-git / another engine</text><path d="M570 200H625" fill="none" stroke="#24786e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="633" y="25" width="425" height="355" rx="20" fill="#d8e9df" stroke="#24786e" stroke-width="2"/><rect x="660" y="47" width="195" height="38" rx="19" fill="#24786e" stroke="none" stroke-width="2"/><text x="757.5" y="72" font-size="17" fill="#f5f2e9" font-weight="700" text-anchor="middle">CHANGE ARTIFACT</text><text x="661" y="129" font-size="19" fill="#556b68" font-weight="500" text-anchor="start">Entity</text><text x="817" y="129" font-size="24" fill="#183e40" font-weight="700" text-anchor="start">Wall W-17</text><text x="661" y="177" font-size="19" fill="#556b68" font-weight="500" text-anchor="start">Property</text><text x="817" y="177" font-size="24" fill="#183e40" font-weight="700" text-anchor="start">FireRating</text><text x="661" y="225" font-size="19" fill="#556b68" font-weight="500" text-anchor="start">Before → after</text><text x="817" y="225" font-size="24" fill="#183e40" font-weight="700" text-anchor="start">EI 60 → EI 90</text><path d="M661 251H1030" fill="none" stroke="#cbd4ca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="661" y="292" font-size="22" fill="#183e40" font-weight="600" text-anchor="start">Source + target pinned by digest</text><text x="661" y="330" font-size="22" fill="#556b68" font-weight="500" text-anchor="start">Typed values · explicit deletions</text><path d="M1060 200H1114" fill="none" stroke="#24786e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1122" y="130" width="288" height="140" rx="20" fill="#183e40" stroke="#183e40" stroke-width="2"/><text x="1266" y="185" font-size="30" fill="#f7f7ec" font-weight="700" text-anchor="middle">OCI registry</text><text x="1266" y="226" font-size="21" fill="#d8e9df" font-weight="500" text-anchor="middle">Publish · copy · pull</text><path d="M1266 272V324" fill="none" stroke="#24786e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1122" y="332" width="288" height="80" rx="20" fill="#fffdf7" stroke="#cbd4ca" stroke-width="2"/><text x="1266" y="381" font-size="22" fill="#183e40" font-weight="600" text-anchor="middle">Query · review · validate</text><text x="14" y="460" font-size="25" fill="#556b68" font-weight="500" text-anchor="start">A proposed, queryable artifact profile — independent of the comparison engine.</text></g><text x="88" y="773" font-size="28" font-weight="700" letter-spacing="-.5">Publish the change. Query it from tools that support the profile.</text><path d="M88 826H1512" stroke="#cbd4ca"/><text x="88" y="856" font-size="13" font-weight="600" fill="#556b68">Saleem · AnkerDB</text><text x="800" y="856" text-anchor="middle" font-size="13" fill="#556b68">S18 · S6 · S7 · S20</text><text x="1512" y="856" text-anchor="end" font-size="13" fill="#556b68">28 OCT 2026 / ECOSYSTEM PROPOSAL</text></svg>