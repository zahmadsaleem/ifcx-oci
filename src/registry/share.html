<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Shared files · Subsoil</title>
<link rel="icon" type="image/svg+xml" href="/brand/symbol.svg">
<style>body{font:16px system-ui;max-width:64rem;margin:4rem auto;padding:0 1rem}header{margin-bottom:2rem}header img{display:block;width:160px;height:40px}button{margin:.3rem;padding:.5rem}li{margin:1rem 0}code{overflow-wrap:anywhere}</style>
<header><a href="/explore"><img src="/brand/logo.svg" alt="Subsoil" width="160" height="40"></a></header>
<h1>Files shared with you</h1><p>See what your team has shared. Ask the sender if you need help opening a model.</p><p id="status" role="status" aria-live="polite">Opening shared files…</p><ul id="repositories"></ul>
<noscript><p>Turn on JavaScript in your browser to see these files.</p></noscript>
<script>
(async()=>{
 const secret=new URLSearchParams(location.hash.slice(1)).get('secret');
 history.replaceState(null,'',location.pathname);
 const status=document.getElementById('status'), list=document.getElementById('repositories');
 let root, deadline=0;
 async function login(){const r=await fetch('/shares/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret}),credentials:'omit',cache:'no-store'});if(!r.ok)throw Error('This link has expired or is no longer available. Ask the sender for a new link.');const s=await r.json();root=s.access_token;deadline=Date.now()+s.expires_in*1000;return s;}
 async function request(path,repo){if(Date.now()>deadline-10000)await login();let token=root;if(repo){const r=await fetch('/token?scope='+encodeURIComponent('repository:'+repo+':pull'),{headers:{Authorization:'Bearer '+root},credentials:'omit',cache:'no-store'});if(!r.ok)throw Error('You don’t have access to these files. Ask the sender for a new link.');token=(await r.json()).access_token;}const r=await fetch(path,{headers:{Authorization:'Bearer '+token},credentials:'omit',cache:'no-store'});if(!r.ok)throw Error('Couldn’t load these files. Please try again.');return r;}
 function row(text){const item=document.createElement('li');item.textContent=text;list.append(item);return item;}
 function message(error){return error instanceof TypeError?'Couldn’t connect. Check your connection and try again.':error.message;}
 try{
  const session=await login();
  status.textContent='These files are available until '+new Date(session.session_expires_at*1000).toLocaleString()+'.';
  const catalog=await(await request('/v2/_catalog?n=1000')).json();
  for(const repo of catalog.repositories){
   const tags=await(await request('/v2/'+repo+'/tags/list',repo)).json();
   for(const tag of tags.tags){
    const item=row(repo+' · '+tag);
    const button=document.createElement('button');
    button.textContent='Show files';
    button.onclick=async()=>{
     button.disabled=true;button.textContent='Loading…';
     try{
      const manifest=await(await request('/v2/'+repo+'/manifests/'+tag,repo)).json();
      const files=[manifest.config,...(manifest.layers||[])].filter(Boolean);
      const names=document.createElement('ul');
      files.forEach((file,index)=>{
       const name=document.createElement('li');
       name.textContent=file.annotations?.['org.opencontainers.image.title']||(index===0?'File information':'File '+index);
       names.append(name);
      });
      if(!files.length){const empty=document.createElement('li');empty.textContent='No files to show in this version.';names.append(empty);}
      const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');
      summary.textContent='Technical details';pre.textContent=JSON.stringify(manifest,null,2);details.append(summary,pre);
      item.append(names,details);button.remove();
     }catch(error){status.textContent=message(error);button.disabled=false;button.textContent='Show files';}
    };
    item.append(button);
   }
  }
  if(!list.children.length)row('No files have been shared through this link.');
 }catch(error){status.textContent=message(error);}
})();
</script></html>
